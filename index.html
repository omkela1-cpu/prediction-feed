<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Markets">
<meta name="theme-color" content="#fff1e5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Prediction Feed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Same look as Om's Short Seller Feed: one reading column on salmon paper, serif headlines,
   quiet sans for navigation and data, sections under a heavy ink rule. Light only, by design.
   No badges, no all-caps labels, no filler text. */
:root{
  color-scheme:light;
  --paper:#fff1e5; --wheat:#f2dfce; --ink:#33302e; --ink-2:#66605c; --rule:#ccc1b7;
  --claret:#990f3d; --teal:#0d7680; --down:#cc0000; --up:#0a7a3f;
  --serif:"Newsreader","Iowan Old Style",Georgia,"Times New Roman",serif;
  --sans:"Hanken Grotesk",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--sans);
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:680px;margin:0 auto;padding-top:calc(env(safe-area-inset-top,0px) + 20px);
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 56px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:inherit}
button,select,input{font:inherit;color:inherit}
button,a{touch-action:manipulation}
button{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
[hidden]{display:none!important}
.link{background:none;border:0;padding:0;color:var(--teal);font-weight:600;font-size:13.5px;cursor:pointer;
  text-decoration:underline;text-underline-offset:3px}
.link:disabled{color:var(--ink-2);text-decoration:none}

/* Masthead */
.mast{display:grid;gap:10px;padding-bottom:0;border-bottom:1px solid var(--ink)}
.mast h1{margin:0;font:500 clamp(34px,8vw,44px)/1.02 var(--serif);letter-spacing:-.015em}
.mast h1 a{text-decoration:none}
.status{font-size:13px;color:var(--ink-2);display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.nav{display:flex;gap:22px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.nav::-webkit-scrollbar{display:none}
.nav button{background:none;border:0;border-bottom:3px solid transparent;padding:13px 0 11px;font-weight:600;font-size:15px;
  white-space:nowrap;cursor:pointer}
.nav button[aria-current="page"]{border-bottom-color:var(--claret)}
.notice{font-size:14px;color:var(--ink-2);padding:10px 0;border-bottom:1px solid var(--rule)}
.notice.bad{color:var(--down)}

/* Feed */
.section{margin:30px 0 0;padding-top:6px;border-top:3px solid var(--ink);font:600 15px/1.3 var(--sans)}
.item{padding:16px 0 18px;border-bottom:1px solid var(--rule);display:grid;gap:8px;min-width:0}
.kicker{font-size:14px;font-weight:600;color:var(--claret);display:flex;gap:0 8px;flex-wrap:wrap;align-items:baseline}
.kicker .co{color:var(--ink)}
.kicker .sep{color:var(--rule);font-weight:400}
.kicker .rank{margin-left:auto;color:var(--ink-2);font-weight:500;font-size:13px}
.item h2{margin:0;font:500 21px/1.22 var(--serif);letter-spacing:-.005em;text-wrap:pretty;overflow-wrap:anywhere}
.item h2 a{text-decoration:none}
.outs{display:grid;gap:5px;margin-top:2px}
.out{display:grid;grid-template-columns:minmax(0,1fr) 72px 44px;gap:10px;align-items:center;font-size:15px}
.out .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.out .bar{height:4px;background:var(--wheat)}
.out .bar i{display:block;height:100%;background:var(--teal)}
.out .pc{text-align:right;font-weight:700}
.facts{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:13.5px;color:var(--ink-2);align-items:baseline}
.facts b{font-weight:700;color:var(--ink)}
.facts .down{color:var(--down)} .facts .up{color:var(--up)}
.empty{padding:40px 0;color:var(--ink-2)}

/* Market page */
.back{display:inline-block;margin:0 0 4px;padding:12px 0;font-size:14px;font-weight:600;color:var(--teal);text-underline-offset:3px}
.story h1{margin:8px 0 14px;font:500 clamp(26px,6.4vw,36px)/1.12 var(--serif);letter-spacing:-.012em;text-wrap:balance}
.read{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;min-height:54px}
.read .big{font:500 44px/1 var(--serif);letter-spacing:-.02em}
.read .what{font-size:15px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.read .when{font-size:13.5px;color:var(--ink-2);width:100%}
.read .when .up{color:var(--up)} .read .when .down{color:var(--down)}
.chart{position:relative;margin-top:10px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.chart canvas{display:block;width:100%;height:240px;touch-action:pan-y;cursor:crosshair}
.chart .msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--ink-2);font-size:14px;
  text-align:center;padding:0 20px;pointer-events:none}
.ranges{display:flex;gap:22px;margin-top:0}
.ranges button{background:none;border:0;border-bottom:3px solid transparent;padding:13px 0 10px;font-weight:600;font-size:14px;cursor:pointer;color:var(--ink-2)}
.ranges button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--claret)}
.pick{margin-top:22px;border-top:3px solid var(--ink)}
.pick button{display:grid;grid-template-columns:minmax(0,1fr) 72px 44px;gap:10px;align-items:center;width:100%;text-align:left;
  background:none;border:0;border-bottom:1px solid var(--rule);padding:11px 0 11px 10px;border-left:3px solid transparent;font-size:15.5px;cursor:pointer}
.pick button[aria-pressed="true"]{border-left-color:var(--claret);font-weight:600}
.pick .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick .bar{height:4px;background:var(--wheat)} .pick .bar i{display:block;height:100%;background:var(--teal)}
.pick .pc{text-align:right;font-weight:700}
.story .facts{margin-top:16px}

/* Settings */
dialog{background:var(--paper);color:var(--ink);border:1px solid var(--ink);border-radius:3px;width:min(92vw,420px);padding:18px}
dialog::backdrop{background:rgba(51,48,46,.45)}
dialog h3{margin:0 0 4px;font:500 24px/1.2 var(--serif)}
label{display:block;font-size:13.5px;color:var(--ink-2);margin:14px 0 4px}
select,input[type="text"]{width:100%;height:44px;padding:0 10px;font-size:16px;background:#fff;border:1px solid var(--rule);border-radius:3px}
.pair{display:flex;gap:18px;justify-content:flex-end;margin-top:18px}
.pair .link{font-size:15px}
</style>
</head>
<body>
<div class="wrap">
  <section id="feedview">
    <header class="mast">
      <h1><a href="#">Prediction Feed</a></h1>
      <div class="status"><span id="stamp"></span><button class="link" id="refresh" type="button">Refresh</button><button class="link" id="gear" type="button">Settings</button></div>
      <nav class="nav" id="tabs" aria-label="Sections"></nav>
    </header>
    <div id="notes"></div>
    <main id="main"></main>
  </section>

  <section id="detail" hidden>
    <a class="back" href="#" id="back">Back</a>
    <article class="story" id="story"></article>
  </section>
</div>

<dialog id="dlg">
  <h3>Settings</h3>
  <label for="sTop">Markets to show</label>
  <select id="sTop"><option>10</option><option>20</option><option>30</option><option>50</option></select>
  <label for="sRank">Rank by</label>
  <select id="sRank"><option value="vol24">24h volume</option><option value="liq">Liquidity / open interest</option></select>
  <label for="sSrc">Sources</label>
  <select id="sSrc"><option value="both">Polymarket and Kalshi</option><option value="pm">Polymarket only</option><option value="ka">Kalshi only</option></select>
  <label for="sRelay">Kalshi relay URL (leave empty to use the built-in one)</label>
  <input id="sRelay" type="text" placeholder="https://your-worker.workers.dev" autocapitalize="off" autocorrect="off">
  <div class="pair"><button class="link" id="sCancel" type="button">Cancel</button><button class="link" id="sSave" type="button">Save</button></div>
</dialog>

<script>
/* ---------- EDIT BUCKETS HERE ----------
   First match wins. Unmatched markets go to "Other". */
const BUCKETS = [
  {name:"Macro",          re:/\b(fed|fomc|rate cuts?|rate hikes?|interest rates?|powell|basis points|bps|federal funds|ecb|bank of england|central bank|inflation|cpi|pce|gdp|recession|unemployment|jobs report|payrolls|tariffs?|treasury|yields?|debt ceiling|economy|s&p|nasdaq|dow|vix|fed rates)\b/i},
  {name:"Politics & Geopolitics", re:/\b(ukraine|russia|china|taiwan|israel|gaza|iran|nato|ceasefire|war|putin|zelensky|north korea|venezuela|hamas|syria|sanctions|invade|nuclear|trump|biden|vance|newsom|congress|senate|house|democrat|republican|elections?|governor|supreme court|shutdown|president|presidential|prime minister|parliament|primary|nominee|impeach|mayor|cabinet|politics|geopolitics)\b/i},
  {name:"Tech & AI",      re:/\b(openai|anthropic|chatgpt|gpt-?\d*|gemini|claude|ai|agi|nvidia|apple|tesla|microsoft|google|meta|spacex|starship|semiconductor|tiktok|tech|science and technology)\b/i},
  {name:"Companies, Energy & Commodities", re:/\b(stocks?|earnings|market cap|largest company|ipo|ceo|merger|acquisition|bankrupt|companies|business|oil|oil prices?|gas prices?|crude|wti|brent|opec|natural gas|gold|silver|copper|commodities|energy)\b/i},
];
/* Excluded entirely (crypto + sports). */
const SKIP = /\b(bitcoin|btc|ethereum|eth|solana|sol|xrp|crypto|stablecoin|coinbase|microstrategy|dogecoin|memecoin|nba|nfl|mlb|nhl|ncaa|ufc|mma|wnba|premier league|la liga|serie a|bundesliga|champions league|europa league|world cup|super bowl|stanley cup|world series|nascar|formula 1|f1|tennis|atp|wta|esports|lol|cs2|dota|valorant|cricket|golf|boxing|vs\.?|sports|soccer|football|basketball|baseball|hockey)\b/i;
const OTHER = "Other";
/* --------------------------------------- */

const PM = "https://gamma-api.polymarket.com/events";
/* Kalshi relay: Kalshi blocks browsers, so live Kalshi prices come through our Cloudflare Worker.
   After deploying it (docs/CLOUDFLARE_SETUP.md), paste its URL between the quotes,
   e.g. "https://prediction-feed-relay.yourname.workers.dev". While it is "", Kalshi markets still
   show, with prices up to about 15 minutes old. Settings > "Kalshi relay URL" overrides this on one phone. */
const KALSHI_RELAY_URL = "https://prediction-feed-relay.omkela1.workers.dev";
const NO_RELAY = "no relay";
const REFRESH_MS = 60000;


const CLOB = "https://clob.polymarket.com/prices-history";
const RANGES = [["1D","1d",5],["1W","1w",60],["1M","1m",180],["All","max",720]]; // label, interval, minutes per point
const SRC = {pm:"Polymarket", ka:"Kalshi"};

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const load = (k, d) => { try { return localStorage.getItem(k) ?? d; } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, v); } catch {} };

let cfg = { top:+load("top","20"), rank:load("rank","vol24"), src:load("src","both"), relay:load("relay","") };
let pins = {}; try { pins = JSON.parse(load("pins","{}")) || {}; } catch {}
function bucketOf(text, extra){ // title first; tags / category only if the title matches nothing
  for(const s of [text, extra]) if(s) for(const t of BUCKETS) if(t.re.test(s)) return t.name;
  return OTHER; }
for(const p of Object.values(pins)) if(p && p.title && ![...BUCKETS.map(b=>b.name), OTHER].includes(p.topic)) p.topic = bucketOf(p.title);
let feed = [], pinned = [], active = "All", srcState = {pm:"…", ka:"…"}, byId = {}, lastAll = {};

function money(n){ n=+n||0; const f=(v,u)=>"$"+(v>=100?Math.round(v):v.toFixed(1))+u;
  if(n>=1e9)return f(n/1e9,"bn"); if(n>=1e6)return f(n/1e6,"m"); if(n>=1e3)return "$"+Math.round(n/1e3)+"k"; return "$"+Math.round(n); }
function compact(n){ n=+n||0; return n>=1e6 ? (n/1e6).toFixed(1)+"m" : n>=1e3 ? Math.round(n/1e3)+"k" : String(Math.round(n)); }
function pct(p){ const v=p*100; return (v>0&&v<1 ? "<1" : v>99&&v<100 ? ">99" : Math.round(v))+"%"; }
function json(s){ try { return typeof s==="string" ? JSON.parse(s) : (s||[]); } catch { return []; } }
async function getJSON(url){
  const ac = new AbortController(); const to = setTimeout(()=>ac.abort(), 15000);
  try { const r = await fetch(url, {signal:ac.signal}); if(!r.ok) throw new Error("HTTP "+r.status); return await r.json(); }
  finally { clearTimeout(to); }
}

/* ---------- Polymarket ---------- */
function normPM(e){
  const tagText = (e.tags||[]).map(t=>t.label).join(" ");
  const ms = (e.markets||[]).filter(m=>!m.closed && m.active!==false);
  if(!ms.length) return null;
  let all; // every outcome with its price and the token id used for price history
  if(ms.length===1){
    const p = json(ms[0].outcomePrices).map(Number), o = json(ms[0].outcomes), tk = json(ms[0].clobTokenIds);
    const c = Number(ms[0].oneDayPriceChange); // change of the first outcome; the other side of a two-way market moves the opposite way
    all = o.map((n,i)=>({name:n,p:p[i],tok:tk[i], d1: i===0 ? c : -c}));
  } else {
    all = ms.map(m=>({name:m.groupItemTitle||m.question, p:Number(json(m.outcomePrices)[0]), tok:json(m.clobTokenIds)[0], d1:Number(m.oneDayPriceChange)}));
  }
  all = all.filter(x=>isFinite(x.p)).sort((a,b)=>b.p-a.p).slice(0,12);
  if(!all.length) return null;
  const text = e.title+" "+tagText;
  return {src:"pm", id:"pm:"+e.slug, ref:e.slug, title:e.title, topic:bucketOf(e.title, tagText), skip:SKIP.test(text),
    outcomes:all.slice(0,3), all,
    vol24:+e.volume24hr||0, liq:+e.liquidity||0, end:e.endDate, url:"https://polymarket.com/event/"+e.slug};
}
async function fetchPM(){
  const pages = await Promise.all([0,50,100].map(o =>
    getJSON(`${PM}?active=true&closed=false&order=volume24hr&ascending=false&limit=50&offset=${o}`)));
  return pages.flat().map(normPM).filter(Boolean);
}
async function onePM(slug){ const d = await getJSON(`${PM}?slug=${encodeURIComponent(slug)}`); return d[0] ? normPM(d[0]) : null; }

/* ---------- Kalshi ---------- */
const cents = (m,k) => m[k+"_dollars"]!=null ? parseFloat(m[k+"_dollars"]) : (m[k]!=null ? m[k]/100 : NaN);
const num = (m,k) => parseFloat(m[k+"_fp"] ?? m[k] ?? 0) || 0;
function kPrice(m){
  const b=cents(m,"yes_bid"), a=cents(m,"yes_ask"), l=cents(m,"last_price");
  if(isFinite(b)&&isFinite(a)&&a>0&&(a-b)<=0.1) return (a+b)/2;
  return isFinite(l)&&l>0 ? l : (isFinite(a)&&a>0 ? a : b);
}
function d1K(m){ const l=cents(m,"last_price"), v=cents(m,"previous_price"); return isFinite(l)&&isFinite(v)&&v>0 ? l-v : NaN; } // previous_price is the price 24 hours ago
function normKA(e, markets){
  const ms = (markets||e.markets||[]).filter(m=>(m.status||"active")==="active" || m.status==="cur");
  if(!ms.length) return null;
  const all = ms.map(m=>({name:m.yes_sub_title||m.subtitle||(ms.length===1?"Yes":m.title), p:kPrice(m), tk:m.ticker, d1:d1K(m)}))
    .filter(x=>isFinite(x.p)).sort((a,b)=>b.p-a.p).slice(0,12);
  if(!all.length) return null;
  const outcomes = all.slice(0,3);
  const text = e.title+" "+(e.category||"");
  return {src:"ka", id:"ka:"+e.event_ticker, ref:e.event_ticker, title:e.title, series:e.series_ticker, topic:bucketOf(e.title, e.category),
    skip:SKIP.test(text) || /^sports$/i.test(e.category||""), outcomes, all,
    // usd24_total (from the hot list) is cash traded, like Polymarket. Without it we only have contracts.
    vol24:e.usd24_total!=null ? +e.usd24_total : ms.reduce((s,m)=>s+num(m,"volume_24h"),0), vol24unit:e.usd24_total!=null ? "usd" : "contracts",
    liq:e.oi_total!=null ? +e.oi_total : ms.reduce((s,m)=>s+num(m,"open_interest"),0),
    end:ms[0].close_time||ms[0].expiration_time, url:"https://kalshi.com/events/"+(e.event_ticker||"").toLowerCase()};
}
const kBase = () => ((cfg.relay||"").trim() || KALSHI_RELAY_URL).replace(/\/+$/,"");
/* Which Kalshi events are hot comes from a file a scheduled GitHub job rebuilds every hour
   (scripts/kalshi-top.mjs, published on the "data" branch). With the relay set up, prices for those
   events are then fetched live; without it, the app shows the prices saved in that file. */
const KALSHI_LIST_URL = "https://raw.githubusercontent.com/omkela1-cpu/prediction-feed/data/kalshi-top.json";
let kaList = null, kaListAt = 0, kaInfo = {live:false, updated:null, relay:false};
async function hotList(){
  if(kaList && Date.now()-kaListAt < 240000) return kaList;
  const d = await getJSON(KALSHI_LIST_URL);
  if(!d || !Array.isArray(d.events)) throw new Error("hot list missing");
  kaList = d; kaListAt = Date.now(); return d;
}
// Live events from the relay carry prices but not the volume totals, so copy those from the hot list.
const withTotals = e => { const h = kaList && kaList.events.find(x=>x.event_ticker===e.event_ticker);
  return h ? {...e, usd24_total:h.usd24_total, vol24_total:h.vol24_total, oi_total:h.oi_total} : e; };
async function fetchKA(){
  const list = await hotList();
  let events = list.events, live = false;
  if(kBase()){
    try {
      const d = await getJSON(`${kBase()}/kalshi/events?tickers=${list.events.slice(0,100).map(e=>encodeURIComponent(e.event_ticker)).join(",")}`);
      if(d.events && d.events.length){ events = d.events.map(withTotals); live = true; }
    } catch {}
  }
  kaInfo = {live, updated:list.updated, relay:!!kBase()};
  return events.map(e=>normKA(e)).filter(Boolean);
}
async function oneKA(t){
  if(kBase()){
    try { const d = await getJSON(`${kBase()}/kalshi/event/${encodeURIComponent(t)}`); if(d.event) return normKA(withTotals(d.event), d.event.markets); } catch {}
  }
  const e = kaList && kaList.events.find(x=>x.event_ticker===t);
  return e ? normKA(e) : null;
}

/* ---------- Refresh ---------- */
let busy=false;
async function refresh(){
  if(busy) return; busy=true; $("refresh").disabled = true;
  const jobs = [];
  if(cfg.src!=="ka") jobs.push(fetchPM().then(r=>({k:"pm",r}),e=>({k:"pm",e})));
  if(cfg.src!=="pm") jobs.push(fetchKA().then(r=>({k:"ka",r}),e=>({k:"ka",e})));
  const res = await Promise.all(jobs);
  const all = [];
  srcState = {pm:cfg.src==="ka"?"off":"…", ka:cfg.src==="pm"?"off":"…"};
  for(const x of res){ if(x.r){ all.push(...x.r); srcState[x.k]="ok"; } else srcState[x.k] = x.e&&x.e.message===NO_RELAY ? "norelay" : "err: "+(x.e&&x.e.message||"failed"); }
  if(all.length){
    const key = cfg.rank==="liq" ? "liq" : "vol24";
    lastAll = Object.fromEntries(all.map(i=>[i.id,i]));
    // refresh pinned: from the feed if present, else look up individually
    const missing = [];
    for(const id of Object.keys(pins)){
      if(lastAll[id]) pins[id] = lastAll[id];
      else if(srcState[pins[id].src]==="ok") missing.push(pins[id]);
    }
    await Promise.all(missing.map(async p=>{
      try { const u = p.src==="pm" ? await onePM(p.ref) : await oneKA(p.ref); if(u) pins[p.id]=u; } catch {}
    }));
    save("pins", JSON.stringify(pins));
    feed = all.filter(i=>!i.skip && !pins[i.id]).sort((a,b)=>b[key]-a[key]).slice(0,cfg.top);
    $("stamp").textContent = "Updated " + new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
  }
  busy=false; $("refresh").disabled = false; render();
  if(cur) { const u = lookup(cur.id); if(u){ cur = u; paintOutcomes(); } }
}
const lookup = id => pins[id] || lastAll[id] || byId[id];

/* ---------- Feed ---------- */
function ends(it){
  const days = it.end ? Math.ceil((new Date(it.end)-Date.now())/864e5) : null;
  if(days==null || !isFinite(days) || days<0) return "";
  return `<span>Ends ${days<=0?"today":days===1?"tomorrow":"in "+days+" days"}</span>`;
}
function chg(d){ const a=Math.abs(d*100); return a<0.05 ? "unchanged" : `<span class="${d>0?"up":"down"}">${d>0?"▲":"▼"} ${a.toFixed(a<10?1:0)} points</span>`; }
function facts(it){
  const top = it.outcomes[0], d1 = top && top.d1;
  return (isFinite(d1) ? `<span>${esc(top.name)} 24h ${chg(d1)}</span>` : "") + `<span>24h volume <b>${it.vol24unit==="contracts" ? compact(it.vol24)+" contracts" : money(it.vol24)}</b></span><span>${it.src==="pm"?"Liquidity":"Open interest"} ${money(it.liq)}</span>${ends(it)}`;
}
const outRow = o => `<span class="nm">${esc(o.name)}</span><span class="bar"><i style="width:${Math.round(o.p*100)}%"></i></span><span class="pc">${pct(o.p)}</span>`;
function item(it, rank){
  byId[it.id] = it;
  const on = !!pins[it.id];
  return `<article class="item">
    <div class="kicker"><span>${SRC[it.src]}</span><span class="sep">|</span><span class="co">${esc(it.topic)}</span>${rank?`<span class="rank">No. ${rank}</span>`:""}</div>
    <h2><a href="#m=${encodeURIComponent(it.id)}">${esc(it.title)}</a></h2>
    <div class="outs">${it.outcomes.map(o=>`<div class="out">${outRow(o)}</div>`).join("")}</div>
    <div class="facts">${facts(it)}<button class="link" type="button" data-pin="${esc(it.id)}">${on?"Unpin":"Pin"}</button></div>
  </article>`;
}
function notes(){
  let html = "";
  for(const s of ["pm","ka"]) if(String(srcState[s]).startsWith("err"))
    html += `<div class="notice bad">${SRC[s]} is unavailable (${esc(srcState[s].slice(5))}).${s==="ka"?" The Kalshi hot list could not be read.":""}</div>`;
  if(srcState.ka==="ok" && !kaInfo.live && kaInfo.updated){
    const at = new Date(kaInfo.updated).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
    html += `<div class="notice">Kalshi prices are as of ${esc(at)}${kaInfo.relay ? " because the relay did not answer." : ". They become live once the relay is set up."}</div>`;
  }
  $("notes").innerHTML = html;
}
function render(){
  byId = {};
  pinned = Object.values(pins);
  const order = [...BUCKETS.map(b=>b.name), OTHER];
  const names = order.filter(n=>feed.some(i=>i.topic===n) || pinned.some(i=>i.topic===n));
  if(active!=="All" && active!=="Pinned" && !names.includes(active)) active = "All";
  if(active==="Pinned" && !pinned.length) active = "All";
  const tabs = ["All", ...(pinned.length?["Pinned"]:[]), ...names];
  $("tabs").innerHTML = tabs.map(n=>`<button type="button" data-t="${esc(n)}"${n===active?' aria-current="page"':""}>${esc(n)}${n==="Pinned"?" ("+pinned.length+")":""}</button>`).join("");
  notes();
  let html = "";
  const pv = pinned.filter(i=> active==="All" || active==="Pinned" || i.topic===active).sort((a,b)=>b.vol24-a.vol24);
  if(pv.length) html += `<div class="section">Pinned</div>` + pv.map(i=>item(i)).join("");
  if(active!=="Pinned"){
    let rank = 0; const ranked = new Map(feed.map(i=>[i.id, ++rank]));
    for(const n of order.filter(n=>active==="All"||active===n)){
      const list = feed.filter(i=>i.topic===n);
      if(list.length) html += `<div class="section">${esc(n)}</div>` + list.map(i=>item(i, ranked.get(i.id))).join("");
    }
  }
  if(!html) html = `<div class="empty">${busy||!feed.length?"Loading markets":"Nothing in this section right now."}</div>`;
  $("main").innerHTML = html;
}

/* ---------- Market page with a chart you can drag across ---------- */
let cur = null, sel = 0, range = 1, pts = [], hover = -1, feedScroll = 0, histSeq = 0;
const histCache = new Map();
async function priceHistory(tok, r, series){
  const key = tok+"|"+r, c = histCache.get(key);
  if(c && Date.now()-c.t < 60000) return c.pts;
  let p;
  if(series){ // Kalshi: through the relay, which returns [[seconds, price], ...]
    const d = await getJSON(`${kBase()}/kalshi/history?series=${encodeURIComponent(series)}&ticker=${encodeURIComponent(tok)}&r=${RANGES[r][1]}`);
    p = (d.pts||[]).map(x=>({t:x[0], p:x[1]})).filter(x=>isFinite(x.t)&&isFinite(x.p));
  } else {
    const d = await getJSON(`${CLOB}?market=${encodeURIComponent(tok)}&interval=${RANGES[r][1]}&fidelity=${RANGES[r][2]}`);
    p = (d.history||[]).filter(x=>isFinite(x.t)&&isFinite(x.p));
  }
  histCache.set(key, {t:Date.now(), pts:p}); return p;
}
function fmtTime(t){
  const d = new Date(t*1000), day = d.toLocaleDateString([], {day:"numeric",month:"short"});
  return range<=1 ? day+", "+d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}) : range===3 ? d.toLocaleDateString([], {day:"numeric",month:"short",year:"numeric"}) : day;
}
function paintRead(){
  const o = (cur.all||cur.outcomes)[sel]; if(!o) return;
  const i = hover>=0 ? hover : pts.length-1, has = pts.length>0;
  const p = hover>=0 && has ? pts[i].p : o.p;
  let when = "";
  if(hover>=0 && has) when = esc(fmtTime(pts[i].t));
  else if(has && pts.length>1){
    const ch = (o.p - pts[0].p)*100, a = Math.abs(ch);
    when = a<0.05 ? `Unchanged over ${RANGES[range][0]==="All"?"its lifetime":"the past "+({"1D":"day","1W":"week","1M":"month"})[RANGES[range][0]]}`
      : `<span class="${ch>0?"up":"down"}">${ch>0?"▲":"▼"} ${a.toFixed(a<10?1:0)} points</span> ${RANGES[range][0]==="All"?"since it opened":"over the past "+({"1D":"day","1W":"week","1M":"month"})[RANGES[range][0]]}`;
  }
  $("read").innerHTML = `<span class="big">${pct(p)}</span><span class="what">${esc(o.name)}</span><span class="when">${when||"&nbsp;"}</span>`;
}
function draw(){
  const cv = $("cv"); if(!cv) return;
  const dpr = window.devicePixelRatio||1, W = cv.clientWidth, H = cv.clientHeight;
  if(cv.width!==Math.round(W*dpr)){ cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr); }
  const g = cv.getContext("2d"); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,W,H);
  if(pts.length<2) return;
  const padT=14, padB=24, padR=40, x0=0, x1=W-padR, y0=padT, y1=H-padB;
  let lo = Math.min(...pts.map(p=>p.p)), hi = Math.max(...pts.map(p=>p.p));
  const span = Math.max(hi-lo, 0.04), mid=(hi+lo)/2; lo = Math.max(0, mid-span*0.65); hi = Math.min(1, mid+span*0.65);
  if(hi-lo<0.04){ if(lo===0) hi=0.04; else lo=hi-0.04; }
  const t0 = pts[0].t, t1 = pts[pts.length-1].t;
  const X = t => x0 + (x1-x0)*(t-t0)/Math.max(1,t1-t0), Y = p => y1 - (y1-y0)*(p-lo)/(hi-lo);
  g.font = "12px 'Hanken Grotesk',-apple-system,sans-serif"; g.fillStyle = "#66605c"; g.strokeStyle = "#ccc1b7"; g.lineWidth = 1;
  for(let k=0;k<=2;k++){ const v = lo+(hi-lo)*k/2, y = Math.round(Y(v))+.5;
    g.beginPath(); g.moveTo(x0,y); g.lineTo(x1,y); g.stroke();
    g.textAlign="left"; g.textBaseline="middle"; g.fillText((v*100).toFixed(hi-lo<0.1?1:0)+"%", x1+6, y); }
  g.textBaseline="alphabetic"; g.textAlign="left"; g.fillText(fmtTime(t0), x0, H-6);
  g.textAlign="right"; g.fillText(fmtTime(t1), x1, H-6);
  g.beginPath(); pts.forEach((p,i)=> i ? g.lineTo(X(p.t),Y(p.p)) : g.moveTo(X(p.t),Y(p.p)));
  g.strokeStyle = "#0d7680"; g.lineWidth = 2; g.lineJoin = "round"; g.stroke();
  const i = hover>=0 ? hover : pts.length-1, px = X(pts[i].t), py = Y(pts[i].p);
  if(hover>=0){ g.beginPath(); g.moveTo(Math.round(px)+.5,y0-8); g.lineTo(Math.round(px)+.5,y1); g.strokeStyle="#33302e"; g.lineWidth=1; g.stroke(); }
  g.beginPath(); g.arc(px,py,4.5,0,7); g.fillStyle = hover>=0 ? "#990f3d" : "#0d7680"; g.fill();
  cv._x = {x0,x1,t0,t1};
}
function scrub(e){
  const cv = $("cv"), m = cv._x; if(!m || pts.length<2) return;
  const x = e.clientX - cv.getBoundingClientRect().left;
  const t = m.t0 + (m.t1-m.t0)*Math.min(1,Math.max(0,(x-m.x0)/(m.x1-m.x0)));
  let lo=0, hi=pts.length-1; while(hi-lo>1){ const md=(lo+hi)>>1; if(pts[md].t<t) lo=md; else hi=md; }
  hover = (t-pts[lo].t < pts[hi].t-t) ? lo : hi; draw(); paintRead();
}
function endScrub(){ if(hover<0) return; hover = -1; draw(); paintRead(); }
async function loadChart(){
  const o = (cur.all||cur.outcomes)[sel], seq = ++histSeq, msg = $("cmsg");
  pts = []; hover = -1; draw(); paintRead();
  const kal = cur.src==="ka", id = kal ? o && o.tk : o && o.tok;
  if(kal && !kBase()){ msg.textContent = "Kalshi charts need the relay. Set it in Settings."; return; }
  if(!id || (kal && !cur.series)){ msg.textContent = "No price history for this outcome."; return; }
  msg.textContent = "Loading price history";
  try {
    const p = await priceHistory(id, range, kal ? cur.series : null); if(seq!==histSeq) return;
    pts = p; msg.textContent = p.length<2 ? "Not enough trading yet to draw a chart." : "";
  } catch(err){ if(seq!==histSeq) return; msg.textContent = "Could not load price history. Tap a range to try again."; }
  draw(); paintRead();
}
function paintOutcomes(){
  const list = cur.all||cur.outcomes;
  if(sel>=list.length) sel = 0;
  $("pick").innerHTML = list.map((o,i)=>`<button type="button" data-o="${i}" aria-pressed="${i===sel}">${outRow(o)}</button>`).join("");
  $("dfacts").innerHTML = facts(cur) + `<button class="link" type="button" data-pin="${esc(cur.id)}">${pins[cur.id]?"Unpin":"Pin"}</button>`
    + `<a class="link" href="${esc(cur.url)}" target="_blank" rel="noopener">Open on ${SRC[cur.src]}</a>`;
  paintRead();
}
function showDetail(it){
  cur = it; sel = 0; byId[it.id] = it;
  $("story").innerHTML = `<div class="kicker"><span>${SRC[it.src]}</span><span class="sep">|</span><span class="co">${esc(it.topic)}</span></div>
    <h1>${esc(it.title)}</h1>
    <div class="read" id="read"></div>
    <div class="chart"><canvas id="cv"></canvas><div class="msg" id="cmsg"></div></div>
    <div class="ranges" id="ranges">${RANGES.map((r,i)=>`<button type="button" data-r="${i}" aria-pressed="${i===range}">${r[0]}</button>`).join("")}</div>
    <div class="pick" id="pick"></div>
    <div class="facts" id="dfacts"></div>`;
  const cv = $("cv");
  cv.addEventListener("pointerdown", e=>{ try{cv.setPointerCapture(e.pointerId);}catch{} scrub(e); });
  cv.addEventListener("pointermove", e=>{ if(e.pointerType==="mouse" || e.buttons || e.pressure>0) scrub(e); });
  for(const ev of ["pointerup","pointercancel","pointerleave"]) cv.addEventListener(ev, endScrub);
  paintOutcomes(); loadChart();
}
async function route(){
  const m = location.hash.match(/^#m=(.+)$/);
  if(!m){ cur = null; histSeq++; $("detail").hidden = true; $("feedview").hidden = false; scrollTo(0, feedScroll); return; }
  const id = decodeURIComponent(m[1]);
  if(!$("feedview").hidden) feedScroll = scrollY;
  $("feedview").hidden = true; $("detail").hidden = false; scrollTo(0,0);
  let it = lookup(id);
  if(it && !it.all) it = null; // pins saved by an older version have no token ids
  if(!it){
    $("story").innerHTML = `<div class="empty">Loading market</div>`;
    try { it = id.startsWith("pm:") ? await onePM(id.slice(3)) : await oneKA(id.slice(3)); } catch {}
    if(location.hash !== "#m="+m[1]) return;
  }
  if(it) showDetail(it); else $("story").innerHTML = `<div class="empty">This market could not be loaded. It may have closed.</div>`;
}

/* ---------- Events ---------- */
document.addEventListener("click", e=>{
  const s = e.target.closest("[data-pin]");
  if(s){ const it = lookup(s.dataset.pin) || (cur && cur.id===s.dataset.pin ? cur : null); if(!it) return;
    if(pins[it.id]) delete pins[it.id]; else pins[it.id] = it;
    save("pins", JSON.stringify(pins));
    if(cur) paintOutcomes();
    if(!pins[it.id]) refresh(); else { feed = feed.filter(i=>i.id!==it.id); render(); }
    return; }
  const t = e.target.closest("[data-t]"); if(t){ active=t.dataset.t; render(); return; }
  const o = e.target.closest("[data-o]"); if(o && cur){ sel = +o.dataset.o; paintOutcomes(); loadChart(); return; }
  const r = e.target.closest("[data-r]"); if(r && cur){ range = +r.dataset.r;
    document.querySelectorAll("#ranges button").forEach((b,i)=>b.setAttribute("aria-pressed", i===range)); loadChart(); }
});
$("back").addEventListener("click", e=>{ e.preventDefault(); location.hash = ""; });
$("refresh").onclick = refresh;
$("gear").onclick = ()=>{ $("sTop").value=cfg.top; $("sRank").value=cfg.rank; $("sSrc").value=cfg.src; $("sRelay").value=cfg.relay; $("dlg").showModal(); };
$("sCancel").onclick = ()=>$("dlg").close();
$("sSave").onclick = ()=>{
  cfg = {top:+$("sTop").value, rank:$("sRank").value, src:$("sSrc").value, relay:$("sRelay").value.trim()};
  for(const k in cfg) save(k, cfg[k]);
  $("dlg").close(); refresh();
};
addEventListener("hashchange", route);
addEventListener("resize", draw);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) refresh(); });
setInterval(()=>{ if(!document.hidden) refresh(); }, REFRESH_MS);
render(); route(); refresh();
</script>
</body>
</html>
