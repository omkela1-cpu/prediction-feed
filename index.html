<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Markets">
<meta name="theme-color" content="#0b0d10">
<title>Prediction Feed</title>
<style>
:root{--bg:#0b0d10;--card:#14181d;--line:#232a32;--tx:#e8ecf0;--mut:#8a96a3;--up:#3ecf8e;--dn:#ff6b6b;--acc:#6ea8ff;--pm:#7c5cff;--ka:#19c37d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:rgba(11,13,16,.92);backdrop-filter:blur(10px);padding:calc(env(safe-area-inset-top) + 8px) 12px 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:18px;margin:0}
.status{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mut)}
.dot.live{background:var(--up);animation:p 2s infinite}
@keyframes p{50%{opacity:.35}}
button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 0 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;border-radius:999px;padding:6px 12px;font-size:14px}
.tab.on{background:var(--acc);color:#06101f;border-color:var(--acc);font-weight:600}
main{padding:10px 12px calc(env(safe-area-inset-bottom) + 30px)}
h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:18px 2px 8px}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px;color:inherit;text-decoration:none}
.ct{font-weight:600;margin-bottom:8px}
.row{display:flex;align-items:center;gap:8px;margin:4px 0}
.nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#cfd6dd}
.bar{flex:0 0 70px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.pr{flex:0 0 46px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.up{color:var(--up)}.dn{color:var(--dn)}
.meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--mut)}
.b{font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;color:#fff}
.b.pm{background:var(--pm)}.b.ka{background:var(--ka)}
.note{background:#2a2112;border:1px solid #5a4416;color:#f3d38a;border-radius:12px;padding:10px;font-size:13px;margin:10px 0}
.empty{color:var(--mut);text-align:center;padding:40px 0}
dialog{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:16px;width:min(92vw,420px)}
dialog::backdrop{background:rgba(0,0,0,.6)}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
input,select{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px}
.pair{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.star{position:absolute;top:6px;right:6px;border:0;background:none;font-size:22px;line-height:1;padding:6px 8px;color:var(--mut)}
.star.on{color:#ffc447}
.card{position:relative}
.ct{padding-right:30px}
.ct a{color:inherit;text-decoration:none}
.rk{color:var(--mut);font-weight:500;margin-right:6px}
.tag{font-size:11px;color:var(--mut);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Prediction Feed</h1>
    <div class="status"><span class="dot" id="dot"></span><span id="upd">loading</span><button id="gear" aria-label="Settings">⚙︎</button></div>
  </div>
  <div class="tabs" id="tabs"></div>
</header>
<main id="main"></main>

<dialog id="dlg">
  <b>Settings</b>
  <label>Top markets to show</label>
  <select id="sTop"><option>10</option><option>20</option><option>30</option><option>50</option></select>
  <label>Rank by</label>
  <select id="sRank"><option value="vol24">24h volume</option><option value="liq">Liquidity / open interest</option></select>
  <label>Sources</label>
  <select id="sSrc"><option value="both">Polymarket + Kalshi</option><option value="pm">Polymarket only</option><option value="ka">Kalshi only</option></select>
  <label>Kalshi relay URL (only if Kalshi gets blocked)</label>
  <input id="sRelay" placeholder="https://your-worker.workers.dev/" autocapitalize="off" autocorrect="off">
  <div class="pair"><button id="sCancel">Cancel</button><button id="sSave" class="tab on">Save</button></div>
</dialog>

<script>
/* ---------- EDIT BUCKETS HERE ----------
   First match wins. Unmatched markets go to "Other". */
const BUCKETS = [
  {name:"Fed & Rates",  re:/\b(fed|fomc|rate cuts?|rate hikes?|interest rates?|powell|basis points|bps|federal funds)\b/i},
  {name:"Economy",      re:/\b(inflation|cpi|pce|gdp|recession|unemployment|jobs report|payrolls|tariffs?|treasury|yields?|oil prices?|gas prices?|crude|debt ceiling|economy)\b/i},
  {name:"Tech & AI",    re:/\b(openai|anthropic|chatgpt|gpt-?\d*|gemini|claude|ai|nvidia|apple|tesla|microsoft|google|meta|spacex|starship|ipo|semiconductor|tiktok)\b/i},
  {name:"Geopolitics",  re:/\b(ukraine|russia|china|taiwan|israel|gaza|iran|nato|ceasefire|war|putin|zelensky|north korea|venezuela|hamas|syria|sanctions|invade|nuclear)\b/i},
  {name:"US Politics",  re:/\b(trump|biden|vance|newsom|congress|senate|house|democrat|republican|election|governor|supreme court|shutdown|president|primary|nominee|impeach|mayor|cabinet)\b/i},
  {name:"Markets",      re:/\b(s&p|nasdaq|dow|stocks?|earnings|market cap|largest company|vix)\b/i},
];
/* Excluded entirely (crypto + sports). */
const SKIP = /\b(bitcoin|btc|ethereum|eth|solana|sol|xrp|crypto|stablecoin|coinbase|microstrategy|dogecoin|memecoin|nba|nfl|mlb|nhl|ncaa|ufc|mma|wnba|premier league|la liga|serie a|bundesliga|champions league|europa league|world cup|super bowl|stanley cup|world series|nascar|formula 1|f1|tennis|atp|wta|esports|lol|cs2|dota|valorant|cricket|golf|boxing|vs\.?|sports|soccer|football|basketball|baseball|hockey)\b/i;
const OTHER = "Other";
/* --------------------------------------- */

const PM = "https://gamma-api.polymarket.com/events";
const KA = "https://api.elections.kalshi.com/trade-api/v2/events";
const REFRESH_MS = 60000;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const load = (k, d) => { try { return localStorage.getItem(k) ?? d; } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, v); } catch {} };

let cfg = { top:+load("top","20"), rank:load("rank","vol24"), src:load("src","both"), relay:load("relay","") };
let pins = {}; try { pins = JSON.parse(load("pins","{}")) || {}; } catch {}
let feed = [], pinned = [], active = "All", srcState = {pm:"…", ka:"…"}, byId = {};

function money(n){ n=+n||0; if(n>=1e9)return "$"+(n/1e9).toFixed(1)+"B"; if(n>=1e6)return "$"+(n/1e6).toFixed(1)+"M"; if(n>=1e3)return "$"+Math.round(n/1e3)+"K"; return "$"+Math.round(n); }
function bucketOf(text){ for(const t of BUCKETS) if(t.re.test(text)) return t.name; return OTHER; }
function json(s){ try { return typeof s==="string" ? JSON.parse(s) : (s||[]); } catch { return []; } }
async function getJSON(url){
  const ac = new AbortController(); const to = setTimeout(()=>ac.abort(), 15000);
  try { const r = await fetch(url, {signal:ac.signal}); if(!r.ok) throw new Error("HTTP "+r.status); return await r.json(); }
  finally { clearTimeout(to); }
}

/* ---------- Polymarket ---------- */
function normPM(e){
  const tagText = (e.tags||[]).map(t=>t.label).join(" ");
  const ms = (e.markets||[]).filter(m=>!m.closed && m.active!==false);
  if(!ms.length) return null;
  let outcomes;
  if(ms.length===1){
    const p = json(ms[0].outcomePrices).map(Number), o = json(ms[0].outcomes);
    outcomes = o.map((n,i)=>({name:n,p:p[i]})).filter(x=>isFinite(x.p)).sort((a,b)=>b.p-a.p).slice(0,3);
  } else {
    outcomes = ms.map(m=>({name:m.groupItemTitle||m.question, p:Number(json(m.outcomePrices)[0])}))
      .filter(x=>isFinite(x.p)).sort((a,b)=>b.p-a.p).slice(0,3);
  }
  if(!outcomes.length) return null;
  const text = e.title+" "+tagText;
  return {src:"pm", id:"pm:"+e.slug, ref:e.slug, title:e.title, topic:bucketOf(text), skip:SKIP.test(text), outcomes,
    vol24:+e.volume24hr||0, liq:+e.liquidity||0, end:e.endDate, url:"https://polymarket.com/event/"+e.slug};
}
async function fetchPM(){
  const pages = await Promise.all([0,50,100].map(o =>
    getJSON(`${PM}?active=true&closed=false&order=volume24hr&ascending=false&limit=50&offset=${o}`)));
  return pages.flat().map(normPM).filter(Boolean);
}
async function onePM(slug){ const d = await getJSON(`${PM}?slug=${encodeURIComponent(slug)}`); return d[0] ? normPM(d[0]) : null; }

/* ---------- Kalshi ---------- */
const cents = (m,k) => m[k+"_dollars"]!=null ? parseFloat(m[k+"_dollars"]) : (m[k]!=null ? m[k]/100 : NaN);
const num = (m,k) => parseFloat(m[k+"_fp"] ?? m[k] ?? 0) || 0;
function kPrice(m){
  const b=cents(m,"yes_bid"), a=cents(m,"yes_ask"), l=cents(m,"last_price");
  if(isFinite(b)&&isFinite(a)&&a>0&&(a-b)<=0.1) return (a+b)/2;
  return isFinite(l)&&l>0 ? l : (isFinite(a)&&a>0 ? a : b);
}
function normKA(e, markets){
  const ms = (markets||e.markets||[]).filter(m=>(m.status||"active")==="active" || m.status==="open");
  if(!ms.length) return null;
  const outcomes = ms.map(m=>({name:m.yes_sub_title||m.subtitle||(ms.length===1?"Yes":m.title), p:kPrice(m)}))
    .filter(x=>isFinite(x.p)).sort((a,b)=>b.p-a.p).slice(0,3);
  if(!outcomes.length) return null;
  const text = e.title+" "+(e.category||"");
  return {src:"ka", id:"ka:"+e.event_ticker, ref:e.event_ticker, title:e.title, topic:bucketOf(text),
    skip:SKIP.test(text) || /^sports$/i.test(e.category||""), outcomes,
    vol24:ms.reduce((s,m)=>s+num(m,"volume_24h"),0), liq:ms.reduce((s,m)=>s+num(m,"open_interest"),0),
    end:ms[0].close_time||ms[0].expiration_time, url:"https://kalshi.com/events/"+(e.event_ticker||"").toLowerCase()};
}
const kBase = () => ((cfg.relay||"").trim() || KA).replace(/\/+$/,"");
async function fetchKA(){
  let cursor = "", events = [];
  for(let i=0;i<5;i++){
    const d = await getJSON(`${kBase()}?status=open&with_nested_markets=true&limit=200${cursor?"&cursor="+encodeURIComponent(cursor):""}`);
    events.push(...(d.events||[])); cursor = d.cursor; if(!cursor) break;
  }
  return events.map(e=>normKA(e)).filter(Boolean);
}
async function oneKA(t){ const d = await getJSON(`${kBase()}/${encodeURIComponent(t)}?with_nested_markets=true`); return d.event ? normKA(d.event, d.event.markets||d.markets) : null; }

/* ---------- Refresh ---------- */
let busy=false;
async function refresh(){
  if(busy) return; busy=true; $("dot").classList.remove("live");
  const jobs = [];
  if(cfg.src!=="ka") jobs.push(fetchPM().then(r=>({k:"pm",r}),e=>({k:"pm",e})));
  if(cfg.src!=="pm") jobs.push(fetchKA().then(r=>({k:"ka",r}),e=>({k:"ka",e})));
  const res = await Promise.all(jobs);
  const all = [];
  srcState = {pm:cfg.src==="ka"?"off":"…", ka:cfg.src==="pm"?"off":"…"};
  for(const x of res){ if(x.r){ all.push(...x.r); srcState[x.k]="ok"; } else srcState[x.k]="err: "+(x.e&&x.e.message||"failed"); }
  if(all.length){
    const key = cfg.rank==="liq" ? "liq" : "vol24";
    const index = Object.fromEntries(all.map(i=>[i.id,i]));
    // refresh pinned: from the feed if present, else look up individually
    const missing = [];
    for(const id of Object.keys(pins)){
      if(index[id]) pins[id] = index[id];
      else if(srcState[pins[id].src]==="ok") missing.push(pins[id]);
    }
    await Promise.all(missing.map(async p=>{
      try { const u = p.src==="pm" ? await onePM(p.ref) : await oneKA(p.ref); if(u) pins[p.id]=u; } catch {}
    }));
    save("pins", JSON.stringify(pins));
    feed = all.filter(i=>!i.skip && !pins[i.id]).sort((a,b)=>b[key]-a[key]).slice(0,cfg.top);
  }
  $("dot").classList.toggle("live", all.length>0);
  $("upd").textContent = new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
  busy=false; render();
}

/* ---------- Render ---------- */
function card(it, rank){
  byId[it.id] = it;
  const rows = it.outcomes.map(o=>{
    const pct = Math.round(o.p*100);
    return `<div class="row"><span class="nm">${esc(o.name)}</span><span class="bar"><i style="width:${pct}%"></i></span><span class="pr">${pct}%</span></div>`;
  }).join("");
  const days = it.end ? Math.ceil((new Date(it.end)-Date.now())/864e5) : null;
  const ends = days!=null && isFinite(days) && days>=0 ? `<span>ends ${days<=0?"today":days+"d"}</span>` : "";
  const on = !!pins[it.id];
  return `<div class="card">
    <button class="star ${on?"on":""}" data-pin="${esc(it.id)}" aria-label="${on?"Unpin":"Pin"}">${on?"★":"☆"}</button>
    <div class="ct">${rank?`<span class="rk">${rank}</span>`:""}<a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a></div>${rows}
    <div class="meta"><span class="b ${it.src}">${it.src==="pm"?"Polymarket":"Kalshi"}</span><span class="tag">${esc(it.topic)}</span>
    <span>24h ${money(it.vol24)}</span><span>${it.src==="pm"?"liq":"OI"} ${money(it.liq)}</span>${ends}</div></div>`;
}

function render(){
  byId = {};
  pinned = Object.values(pins);
  const names = [...BUCKETS.map(b=>b.name), OTHER].filter(n=>feed.some(i=>i.topic===n) || pinned.some(i=>i.topic===n));
  if(active!=="All" && active!=="★" && !names.includes(active)) active = "All";
  const tabs = ["All", ...(pinned.length?["★"]:[]), ...names];
  $("tabs").innerHTML = tabs.map(n=>`<button class="tab ${n===active?"on":""}" data-t="${esc(n)}">${n==="★"?"★ Pinned ("+pinned.length+")":esc(n)}</button>`).join("");

  let html = "";
  for(const s of ["pm","ka"]){
    if(String(srcState[s]).startsWith("err")){
      const hint = s==="ka" ? " If it keeps failing, Kalshi may be blocking browser access: add a relay URL in settings." : "";
      html += `<div class="note"><b>${s==="pm"?"Polymarket":"Kalshi"}</b> unavailable (${esc(srcState[s].slice(5))}).${hint}</div>`;
    }
  }
  const inBucket = i => active==="All" || active==="★" || i.topic===active;
  const pv = pinned.filter(i=> active==="★" || inBucket(i)).sort((a,b)=>b.vol24-a.vol24);
  if(pv.length) html += `<h2>★ Pinned</h2>` + pv.map(i=>card(i)).join("");
  if(active!=="★"){
    const groups = [...BUCKETS.map(b=>b.name), OTHER].filter(n=>active==="All"||active===n);
    let rank = 0; const ranked = new Map(feed.map(i=>[i.id, ++rank]));
    for(const n of groups){
      const list = feed.filter(i=>i.topic===n);
      if(!list.length) continue;
      html += `<h2>${esc(n)}</h2>` + list.map(i=>card(i, "#"+ranked.get(i.id))).join("");
    }
  }
  if(!html.replace(/<div class="note">.*?<\/div>/g,"")) html += `<div class="empty">${busy||!feed.length?"Loading markets…":"Nothing here right now."}</div>`;
  $("main").innerHTML = html;
}

document.addEventListener("click", e=>{
  const s = e.target.closest("[data-pin]");
  if(s){ const it = byId[s.dataset.pin]; if(!it) return;
    if(pins[it.id]) delete pins[it.id]; else pins[it.id] = it;
    save("pins", JSON.stringify(pins));
    if(!pins[it.id]) refresh(); else { feed = feed.filter(i=>i.id!==it.id); render(); }
    return; }
  const t = e.target.closest("[data-t]"); if(t){ active=t.dataset.t; render(); scrollTo(0,0); }
});
$("gear").onclick = ()=>{ $("sTop").value=cfg.top; $("sRank").value=cfg.rank; $("sSrc").value=cfg.src; $("sRelay").value=cfg.relay; $("dlg").showModal(); };
$("sCancel").onclick = ()=>$("dlg").close();
$("sSave").onclick = ()=>{
  cfg = {top:+$("sTop").value, rank:$("sRank").value, src:$("sSrc").value, relay:$("sRelay").value.trim()};
  for(const k in cfg) save(k, cfg[k]);
  $("dlg").close(); refresh();
};
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) refresh(); });
setInterval(()=>{ if(!document.hidden) refresh(); }, REFRESH_MS);
render(); refresh();
</script>
</body>
</html>
